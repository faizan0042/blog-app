name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: docker build -t faizan0042/blog-backend:latest ./server

      - name: Push Backend Image
        run: docker push faizan0042/blog-backend:latest

      - name: Build Frontend Image
        run: docker build -t faizan0042/blog-frontend:latest ./client

      - name: Push Frontend Image
        run: docker push faizan0042/blog-frontend:latest
