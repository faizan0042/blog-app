apiVersion: v1
kind: Pod

metadata:
  name: "{{ include "blog-chart.fullname" . }}-backend-test"

  annotations:
    "helm.sh/hook": test

spec:
  restartPolicy: Never

  containers:
    - name: backend-test
      image: curlimages/curl:8.10.1

      command:
        - curl
        - --fail
        - http://backend:5000/api/health
