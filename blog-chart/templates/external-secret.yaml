apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: backend-external-secret
  namespace: {{ .Release.Namespace }}

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: {{ .Values.mockESO.secretStoreName }}
    kind: {{ .Values.mockESO.secretStoreKind }}

  target:
    name: backend-secret
    creationPolicy: Owner

  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: {{ if .Values.mockESO.enabled }}mock-backend-source{{ else }}prod/blog/backend{{ end }}
        property: MONGO_URI

    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ if .Values.mockESO.enabled }}mock-backend-source{{ else }}prod/blog/backend{{ end }}
        property: JWT_SECRET
