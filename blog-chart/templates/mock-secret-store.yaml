{{- if .Values.mockESO.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore

metadata:
  name: mock-secret-store
  namespace: {{ .Release.Namespace }}

spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}

      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt

      auth:
        serviceAccount:
          name: eso-source-reader
{{- end }}
