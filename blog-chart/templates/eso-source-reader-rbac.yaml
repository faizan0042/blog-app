{{- if .Values.mockESO.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-source-secret-reader
  namespace: {{ .Release.Namespace }}

rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mock-backend-source"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-source-secret-reader
  namespace: {{ .Release.Namespace }}

subjects:
  - kind: ServiceAccount
    name: eso-source-reader
    namespace: {{ .Release.Namespace }}

roleRef:
  kind: Role
  name: eso-source-secret-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
