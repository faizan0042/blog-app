apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb

spec:
  replicas: {{ .Values.mongodb.replicaCount }}

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"

          ports:
            - containerPort:  {{ .Values.mongodb.containerPort }}

          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db

      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: {{ .Values.mongodb.persistence.claimName }}
