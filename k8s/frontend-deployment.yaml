apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: faizan0042/blog-frontend:2f474daa60c907ca53273f261bd731ed0b605019

          ports:
            - containerPort: 80
