apiVersion: v1
kind: Pod

metadata:
  name: storage-test

spec:
  containers:
    - name: ubuntu
      image: ubuntu:latest

      command:
        - sleep
        - "3600"

      volumeMounts:
        - name: storage
          mountPath: /data

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: mongo-pvc
